# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Sebas' knowledge garden"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: umami
    websiteId: "60a1ee55-e220-410d-aa67-3fb8280b5601"
  locale: en-US
  baseUrl: brain.sarrietav.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Merriweather
      body: Bricolage Grotesque
      code: Fira Code
    colors:
      lightMode:
        light: "#e8f0e8"
        lightgray: "#cfd8d3"
        gray: "#8a9b95"
        darkgray: "#4e5e58"
        dark: "#2c3e3b"
        secondary: "#4b6d63"
        tertiary: "#748c85"
        highlight: "rgba(75, 107, 95, 0.1)"
        textHighlight: "#b0c4b8"
      darkMode:
        light: "#1a2420"
        lightgray: "#3c4d46"
        gray: "#697c74"
        darkgray: "#ccd4ce"
        dark: "#e4ece8"
        secondary: "#5a7b6f"
        tertiary: "#748c85"
        highlight: "rgba(75, 107, 95, 0.15)"
        textHighlight: "#8fb3a3"
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    order: 5
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    layout:
      position: beforeBody
      priority: 15
  - source: "@quartz-community/created-modified-date"
    enabled: true
    order: 10
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    order: 20
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    order: 30
    options:
      enableInHtmlEmbed: false
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    order: 60
    options:
      markdownLinkResolution: shortest
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    order: 80
    options:
      renderEngine: katex
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true