# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Sebas' knowledge garden"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: umami
    websiteId: "60a1ee55-e220-410d-aa67-3fb8280b5601"
  locale: en-US
  baseUrl: brain.sarrietav.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Merriweather
      body: Bricolage Grotesque
      code: Fira Code
    colors:
      lightMode:
        light: "#e8f0e8"
        lightgray: "#cfd8d3"
        gray: "#8a9b95"
        darkgray: "#4e5e58"
        dark: "#2c3e3b"
        secondary: "#4b6d63"
        tertiary: "#748c85"
        highlight: "rgba(75, 107, 95, 0.1)"
        textHighlight: "#b0c4b8"
      darkMode:
        light: "#1a2420"
        lightgray: "#3c4d46"
        gray: "#697c74"
        darkgray: "#ccd4ce"
        dark: "#e4ece8"
        secondary: "#5a7b6f"
        tertiary: "#748c85"
        highlight: "rgba(75, 107, 95, 0.15)"
        textHighlight: "#8fb3a3"
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    order: 5
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    layout:
      position: beforeBody
      priority: 15
  - source: "@quartz-community/created-modified-date"
    enabled: true
    order: 10
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    order: 20
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    order: 30
    options:
      enableInHtmlEmbed: false
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    order: 60
    options:
      markdownLinkResolution: shortest
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    order: 80
    options:
      renderEngine: katex
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
    options:
      localGraph:
        fontSize: 0.5
      globalGraph:
        repelForce: 3
        fontSize: 0.4
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 40
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/sarrietav-dev
        Twitter: https://twitter.com/sarrietav
        LinkedIn: https://www.linkedin.com/in/sarrietav/
        Email: mailto:brain+sarrietav@protonmail.com
    layout:
      position: footer
      priority: 50
  - source: ./local-plugins/page-title
    enabled: true
    layout:
      position: left
      priority: 5
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/spacer"
    enabled: true
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: ./local-plugins/links-desktop
    enabled: true
    layout:
      position: left
      priority: 40
      display: desktop-only
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: "Recent notes"
      limit: 6
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: ./local-plugins/links-mobile
    enabled: true
    layout:
      position: afterBody
      priority: 10
      display: mobile-only
  - source: "@quartz-community/comments"
    enabled: true
    options:
      provider: giscus
      options:
        repo: sarrietav-dev/braindump
        repoId: R_kgDONO2PUw
        category: Announcements
        categoryId: DIC_kwDONO2PU84Cndyn
        lang: en
        themeUrl: https://brain.sarrietav.dev/static/giscus
    layout:
      position: afterBody
      priority: 20
layout:
  groups:
    toolbar:
      direction: row
      gap: 0.5rem
  byPageType:
    folder:
      exclude:
        - "@quartz-community/tag-list"
        - links-desktop
        - "@quartz-community/recent-notes"
      positions:
        right: []
    tag:
      exclude:
        - "@quartz-community/tag-list"
        - links-desktop
        - "@quartz-community/recent-notes"
      positions:
        right: []
